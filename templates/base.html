<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="RoLookup — search any Roblox user and view their profile, stats, groups and games." />
  <meta property="og:title"       content="{% block og_title %}RoLookup — Roblox User Lookup{% endblock %}" />
  <meta property="og:description" content="Look up any Roblox player's profile, stats, groups, and games." />
  <meta property="og:type"        content="website" />
  <title>{% block title %}RoLookup — Roblox User Lookup{% endblock %}</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Font Awesome 6 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <!-- Custom CSS -->
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet" />
</head>
<body>

<!-- ── Navbar ──────────────────────────────────────────────────────────────── -->
<nav class="navbar navbar-expand-lg sticky-top" id="mainNav">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" href="/">
      <div class="brand-icon"><i class="fas fa-user-circle"></i></div>
      <span class="brand-text">Ro<span class="brand-accent">Lookup</span></span>
    </a>

    <button class="navbar-toggler border-0" type="button"
            data-bs-toggle="collapse" data-bs-target="#navContent">
      <i class="fas fa-bars text-light"></i>
    </button>

    <div class="collapse navbar-collapse" id="navContent">
      <!-- Quick search -->
      <form class="d-flex ms-auto me-3 nav-search-form" action="/search" method="GET">
        <div class="input-group nav-search">
          <input type="text" class="form-control" name="username"
                 placeholder="Quick search…" maxlength="20" autocomplete="off" />
          <button class="btn btn-primary" type="submit">
            <i class="fas fa-search"></i>
          </button>
        </div>
      </form>

      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item">
          <a class="nav-link" href="/api/user/Roblox" target="_blank">
            <i class="fas fa-code me-1"></i>API
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- ── Main ────────────────────────────────────────────────────────────────── -->
<main>{% block content %}{% endblock %}</main>

<!-- ── Footer ──────────────────────────────────────────────────────────────── -->
<footer class="py-4 mt-5">
  <div class="container">
    <div class="row align-items-center text-center text-md-start">
      <div class="col-md-4 mb-2 mb-md-0">
        <span class="fw-bold text-light">Ro<span class="text-danger">Lookup</span></span>
        <span class="text-muted ms-2">· Roblox User Search</span>
      </div>
      <div class="col-md-4 mb-2 mb-md-0 text-center">
        <small class="text-muted">
          Not affiliated with
          <a href="https://www.roblox.com" target="_blank" rel="noopener" class="text-muted">Roblox Corporation</a>
        </small>
      </div>
      <div class="col-md-4 text-md-end">
        <small class="text-muted">
          <i class="fas fa-code me-1"></i>Powered by Roblox Public APIs
        </small>
      </div>
    </div>
  </div>
</footer>

<!-- Toast -->
<div id="toastEl" class="copy-toast"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom JS -->
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
